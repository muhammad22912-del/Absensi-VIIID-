<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Absensi Siswa</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at top left, #4f46e5, transparent 35%),
                radial-gradient(circle at bottom right, #06b6d4, transparent 35%),
                #0f172a;
            color: white;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: auto;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .header p {
            color: #cbd5e1;
        }

        /* JAM */
        .clock-box {
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        #clock {
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        #date {
            margin-top: 5px;
            color: #cbd5e1;
        }

        .wib {
            display: inline-block;
            margin-top: 10px;
            background: #22c55e;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
        }

        /* FORM */
        .card {
            background: rgba(255,255,255,0.10);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            outline: none;
            font-size: 16px;
            margin-bottom: 15px;
        }

        /* CHECKBOX */
        .attendance {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(34,197,94,0.15);
            padding: 14px;
            border-radius: 14px;
            margin-bottom: 18px;
            cursor: pointer;
        }

        .attendance input {
            width: 20px;
            height: 20px;
            accent-color: #22c55e;
        }

        .attendance span {
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(135deg, #22c55e, #06b6d4);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(6,182,212,0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        /* SEARCH */
        .search {
            margin-bottom: 15px;
        }

        /* TABLE */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th {
            background: rgba(59,130,246,0.35);
            padding: 13px;
            text-align: left;
        }

        td {
            padding: 13px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        tr:hover {
            background: rgba(255,255,255,0.05);
        }

        .hadir {
            color: #4ade80;
            font-weight: bold;
        }

        .number {
            color: #94a3b8;
        }

        /* EMPTY */
        .empty {
            text-align: center;
            color: #94a3b8;
            padding: 25px;
        }

        /* FOOTER */
        footer {
            text-align: center;
            color: #94a3b8;
            font-size: 13px;
            margin-top: 25px;
        }

        /* RESPONSIVE */
        @media(max-width: 600px) {

            body {
                padding: 12px;
            }

            .header h1 {
                font-size: 26px;
            }

            #clock {
                font-size: 30px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>📚 ABSENSI SISWA</h1>
        <p>Silakan isi kehadiran kamu hari ini</p>
    </div>

    <!-- JAM -->
    <div class="clock-box">

        <div id="clock">
            00:00:00
        </div>

        <div id="date">
            Memuat tanggal...
        </div>

        <div class="wib">
            🇮🇩 WIB
        </div>

    </div>


    <!-- FORM ABSENSI -->
    <div class="card">

        <h2>📝 Isi Absensi</h2>

        <label for="nama">
            Nama Lengkap
        </label>

        <input
            type="text"
            id="nama"
            placeholder="Masukkan nama kamu..."
            autocomplete="off"
        >

        <label class="attendance">

            <input
                type="checkbox"
                id="hadir"
            >

            <span>
                Saya hadir hari ini
            </span>

        </label>

        <button onclick="kirimAbsensi()">
            ✅ KIRIM ABSENSI
        </button>

    </div>


    <!-- DAFTAR ABSEN -->
    <div class="card">

        <h2>📋 Daftar Kehadiran</h2>

        <input
            class="search"
            type="text"
            id="search"
            placeholder="🔍 Cari nama siswa..."
            oninput="tampilkanData()"
        >

        <div class="table-wrapper">

            <table>

                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Status</th>
                        <th>Tanggal</th>
                        <th>Waktu</th>
                    </tr>
                </thead>

                <tbody id="dataAbsensi">
                </tbody>

            </table>

        </div>

        <div id="kosong" class="empty">
            Belum ada siswa yang melakukan absensi.
        </div>

    </div>


    <footer>
        Sistem Absensi Siswa • Waktu Indonesia Barat (WIB)
    </footer>

</div>


<script>

    // =========================
    // JAM WIB
    // =========================

    function waktuWIB() {

        const sekarang = new Date();

        const waktu = new Intl.DateTimeFormat(
            "id-ID",
            {
                timeZone: "Asia/Jakarta",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit",
                hour12: false
            }
        ).format(sekarang);

        const tanggal = new Intl.DateTimeFormat(
            "id-ID",
            {
                timeZone: "Asia/Jakarta",
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric"
            }
        ).format(sekarang);

        document.getElementById("clock").textContent =
            waktu;

        document.getElementById("date").textContent =
            tanggal;
    }

    setInterval(waktuWIB, 1000);

    waktuWIB();


    // =========================
    // AMBIL DATA ABSENSI
    // =========================

    function ambilData() {

        return JSON.parse(
            localStorage.getItem("dataAbsensi")
        ) || [];

    }


    // =========================
    // SIMPAN ABSENSI
    // =========================

    function kirimAbsensi() {

        const namaInput =
            document.getElementById("nama");

        const hadirInput =
            document.getElementById("hadir");

        const nama =
            namaInput.value.trim();

        // Validasi nama
        if (nama === "") {

            alert("⚠️ Silakan masukkan nama terlebih dahulu!");

            namaInput.focus();

            return;
        }


        // Validasi checkbox
        if (!hadirInput.checked) {

            alert("⚠️ Silakan centang 'Saya hadir hari ini'.");

            return;
        }


        const sekarang = new Date();


        // Tanggal WIB
        const tanggal =
            new Intl.DateTimeFormat(
                "id-ID",
                {
                    timeZone: "Asia/Jakarta",
                    day: "2-digit",
                    month: "2-digit",
                    year: "numeric"
                }
            ).format(sekarang);


        // Jam WIB
        const jam =
            new Intl.DateTimeFormat(
                "id-ID",
                {
                    timeZone: "Asia/Jakarta",
                    hour: "2-digit",
                    minute: "2-digit",
                    second: "2-digit",
                    hour12: false
                }
            ).format(sekarang);


        const data =
            ambilData();


        // Cek apakah nama sudah absen hari ini
        const sudahAbsen =
            data.some(
                siswa =>
                    siswa.nama.toLowerCase() === nama.toLowerCase()
                    &&
                    siswa.tanggal === tanggal
            );


        if (sudahAbsen) {

            alert(
                "⚠️ Nama tersebut sudah melakukan absensi hari ini!"
            );

            return;
        }


        // Data baru
        data.push({

            nama: nama,

            status: "Hadir",

            tanggal: tanggal,

            waktu: jam

        });


        // Simpan
        localStorage.setItem(
            "dataAbsensi",
            JSON.stringify(data)
        );


        // Bersihkan form
        namaInput.value = "";

        hadirInput.checked = false;


        alert(
            "✅ Absensi berhasil dikirim!"
        );


        tampilkanData();

    }


    // =========================
    // TAMPILKAN DATA
    // =========================

    function tampilkanData() {

        const tbody =
            document.getElementById("dataAbsensi");

        const kosong =
            document.getElementById("kosong");

        const search =
            document.getElementById("search")
                .value
                .toLowerCase();


        const data =
            ambilData();


        tbody.innerHTML = "";


        const hasil =
            data.filter(
                siswa =>
                    siswa.nama
                        .toLowerCase()
                        .includes(search)
            );


        if (hasil.length === 0) {

            kosong.style.display = "block";

            return;

        } else {

            kosong.style.display = "none";

        }


        hasil.forEach(
            (siswa, index) => {

                const row =
                    document.createElement("tr");


                row.innerHTML = `

                    <td class="number">
                        ${index + 1}
                    </td>

                    <td>
                        <strong>
                            ${siswa.nama}
                        </strong>
                    </td>

                    <td class="hadir">
                        ✅ ${siswa.status}
                    </td>

                    <td>
                        ${siswa.tanggal}
                    </td>

                    <td>
                        🕐 ${siswa.waktu} WIB
                    </td>

                `;


                tbody.appendChild(row);

            }
        );

    }


    // Tampilkan data ketika halaman dibuka
    tampilkanData();


</script>

</body>
</html>
